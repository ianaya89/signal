[workspace]
resolver = "2"
members = [
    "crates/signal-core",
    "crates/signal-db",
    "crates/signal-scanner",
    "crates/signal-analysis",
    "crates/signal-server",
    "crates/signal-player",
    "crates/signal-search",
    "crates/signal-plugins",
    "crates/signal-cli",
    "src-tauri",
]

[workspace.package]
version = "0.1.6"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-or-later"
repository = "https://github.com/ianaya89/signal"

[workspace.dependencies]
signal-core = { path = "crates/signal-core" }
signal-db = { path = "crates/signal-db" }
signal-scanner = { path = "crates/signal-scanner" }
signal-analysis = { path = "crates/signal-analysis" }
signal-server = { path = "crates/signal-server" }
signal-player = { path = "crates/signal-player" }
signal-search = { path = "crates/signal-search" }
signal-plugins = { path = "crates/signal-plugins" }

tauri = { version = "2", features = ["macos-private-api"] }
tauri-build = "2"

tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util"] }

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
] }

lofty = "0.21"
notify = "7.0"
notify-debouncer-full = "0.4"

symphonia = { version = "0.5", default-features = false, features = ["flac", "pcm", "wav", "aiff", "isomp4", "alac"] }
realfft = "3.4"
hound = "3.5"

axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
md-5 = "0.10"
hex = "0.4"
serde_urlencoded = "0.7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

libmpv2 = "6"
libc = "0.2"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"

criterion = "0.5"
tempfile = "3.13"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
